id = "dev.herdr-block-sleep"
name = "Block Sleep"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Keep macOS awake while Herdr agents are working and the lid is open."
platforms = ["macos"]

[[build]]
command = ["/bin/sh", "-c", "swift build -c release --product herdr-block-sleep && mkdir -p bin && cp .build/release/herdr-block-sleep bin/herdr-block-sleep"]
platforms = ["macos"]

[[startup]]
command = ["./bin/herdr-block-sleep", "start"]

[[actions]]
id = "start"
title = "Start block-sleep monitor"
contexts = ["global"]
command = ["./bin/herdr-block-sleep", "start"]

[[actions]]
id = "stop"
title = "Stop block-sleep monitor"
contexts = ["global"]
command = ["./bin/herdr-block-sleep", "stop"]

[[actions]]
id = "status"
title = "Show block-sleep status"
contexts = ["global"]
command = ["./bin/herdr-block-sleep", "status"]
